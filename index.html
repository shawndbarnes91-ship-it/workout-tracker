<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="format-detection" content="telephone=no">
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
  <main id="view" class="view"><p class="muted center">Loading</p></main>
  <div id="rest-timer" class="rest-timer" hidden></div>
  <div id="toast-root" class="toast-root"></div>
  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tab" data-tab="workout" data-icon="dumbbell">
      <span>Workout</span>
    </button>
    <button type="button" class="tab" data-tab="diet" data-icon="utensils">
      <span>Diet</span>
    </button>
    <button type="button" class="tab" data-tab="supplements" data-icon="pill">
      <span>Supplements</span>
    </button>
    <button type="button" class="tab" data-tab="stats" data-icon="chart">
      <span>Stats</span>
    </button>
  </nav>
</body>
</html>
