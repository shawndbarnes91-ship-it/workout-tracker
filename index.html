<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="format-detection" content="telephone=no">
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
  <main id="view" class="view"><p class="muted center">Loading</p></main>
  <div id="rest-timer" class="rest-timer" hidden></div>
  <div id="toast-root" class="toast-root"></div>
  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tab" data-tab="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Workout</span>
    </button>
    <button type="button" class="tab" data-tab="diet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Diet</span>
    </button>
    <button type="button" class="tab" data-tab="supplements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="7" rx="3.5" transform="rotate(-35 12 12.5)" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.3 8.6l3.6 5.4" stroke="currentColor" stroke-width="2"/></svg>
      <span>Supplements</span>
    </button>
    <button type="button" class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Stats</span>
    </button>
  </nav>
</body>
</html>
